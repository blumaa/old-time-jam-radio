<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.15;

  // Background with rounded corners
  ctx.fillStyle = '#3c2415';
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.arcTo(s, 0, s, r, r);
  ctx.lineTo(s, s - r);
  ctx.arcTo(s, s, s - r, s, r);
  ctx.lineTo(r, s);
  ctx.arcTo(0, s, 0, s - r, r);
  ctx.lineTo(0, r);
  ctx.arcTo(0, 0, r, 0, r);
  ctx.closePath();
  ctx.fill();

  // Inner circle (dial)
  ctx.fillStyle = '#1c1108';
  ctx.beginPath();
  ctx.arc(s/2, s/2, s * 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Brass indicator
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = s * 0.02;
  ctx.beginPath();
  ctx.moveTo(s/2, s/2 - s*0.1);
  ctx.lineTo(s/2, s/2 - s*0.28);
  ctx.stroke();

  // Text
  ctx.fillStyle = '#f5c563';
  ctx.font = `bold ${s * 0.12}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('OTD', s/2, s * 0.82);
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
